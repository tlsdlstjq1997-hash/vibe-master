<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>

    function Car (name, price) {
        //클래스 변수
        this.name = name;
        this.price = price;

        //클래스 함수
        this.info = function(){
            return `이름 : ${this.name} , 가격 : ${this.price} 원 ` ; 
        }
    }

    //클래스 선언
    const car = new Car('붕붕이', '3천만원');
    alert(car.info());


</script>
</body>
</html>
