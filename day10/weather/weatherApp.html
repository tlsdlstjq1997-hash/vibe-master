<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 대시보드</title>
    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #fef9c3 100%);
            font-family: "Pretendard", "Noto Sans KR", sans-serif;
        }

        .search-box {
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.12);
        }

        .search-box .form-select {
            border-radius: 1.5rem;
            border-color: #bae6fd;
        }

        .btn-search {
            border-radius: 1.5rem;
            background: #38bdf8;
            border: none;
            color: #fff;
        }

        .btn-search:hover {
            background: #0ea5e9;
            color: #fff;
        }

        .weather-card {
            background: #ffffff;
            border: none;
            border-radius: 2rem;
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.12);
        }

        .main-weather {
            background: linear-gradient(135deg, #7dd3fc, #bae6fd);
            border-radius: 1.5rem;
            color: #0c4a6e;
        }

        .main-weather img {
            width: 110px;
            height: 110px;
        }

        .tile {
            background: #f0f9ff;
            border-radius: 1.5rem;
            height: 100%;
        }

        .tile .tile-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            background: #ffffff;
        }

        .tile .tile-label {
            color: #64748b;
            font-size: 0.9rem;
        }

        .tile .tile-value {
            color: #0f172a;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .icon-humidity { color: #0ea5e9; }
        .icon-wind-dir { color: #14b8a6; }
        .icon-wind-speed { color: #6366f1; }
        .icon-temp-max { color: #f97316; }
        .icon-temp-min { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <h1 class="text-center fw-bold mb-4" style="color:#0c4a6e;">
                    <i class="bi bi-cloud-sun"></i> 날씨 대시보드
                </h1>

                <!-- 도시 선택 영역 -->
                <div class="search-box p-3 mb-4">
                    <div class="row g-2 align-items-center">
                        <div class="col-12 col-sm-8">
                            <select id="citySelect" class="form-select form-select-lg">
                                <option value="Seoul">서울</option>
                                <option value="Busan">부산</option>
                                <option value="Incheon">인천</option>
                                <option value="Daegu">대구</option>
                                <option value="Daejeon">대전</option>
                                <option value="Gwangju">광주</option>
                                <option value="Ulsan">울산</option>
                                <option value="Jeju City">제주</option>
                                <option value="Tokyo">도쿄</option>
                                <option value="Beijing">베이징</option>
                                <option value="New York">뉴욕</option>
                                <option value="London">런던</option>
                                <option value="Paris">파리</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-4 d-grid">
                            <button id="searchBtn" class="btn btn-search btn-lg">
                                <i class="bi bi-search"></i> 날씨 검색
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 날씨 결과 카드 -->
                <div id="result"></div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ▼ 발급받은 OpenWeather API 키를 입력하세요
        const API_KEY = "62306094d116851440e751e9acccfe0b";

        const citySelect = document.getElementById("citySelect");
        const searchBtn = document.getElementById("searchBtn");
        const result = document.getElementById("result");

        // 풍향(각도)을 16방위 문자로 변환
        function getWindDirection(deg) {
            const dirs = ["북", "북북동", "북동", "동북동", "동", "동남동", "남동", "남남동",
                          "남", "남남서", "남서", "서남서", "서", "서북서", "북서", "북북서"];
            return dirs[Math.round(deg / 22.5) % 16];
        }

        function renderWeather(data) {
            const cityName = citySelect.options[citySelect.selectedIndex].text;
            const weather = data.weather[0];
            const iconUrl = `https://openweathermap.org/img/wn/${weather.icon}@2x.png`;
            const windDeg = data.wind.deg;

            result.innerHTML = `
                <div class="card weather-card p-4">
                    <div class="main-weather p-4 mb-4 text-center">
                        <h2 class="fw-bold mb-0">${cityName}</h2>
                        <img src="${iconUrl}" alt="${weather.description}">
                        <div class="display-4 fw-bold">${Math.round(data.main.temp)}°C</div>
                        <div class="fs-5">${weather.description}</div>
                    </div>

                    <div class="row g-3">
                        <div class="col-6 col-md-4">
                            <div class="tile p-3 text-center">
                                <span class="tile-icon icon-humidity mb-2"><i class="bi bi-droplet-fill"></i></span>
                                <div class="tile-label">습도</div>
                                <div class="tile-value">${data.main.humidity}%</div>
                            </div>
                        </div>
                        <div class="col-6 col-md-4">
                            <div class="tile p-3 text-center">
                                <span class="tile-icon icon-wind-dir mb-2">
                                    <i class="bi bi-arrow-up" style="display:inline-block; transform: rotate(${windDeg + 180}deg);"></i>
                                </span>
                                <div class="tile-label">풍향</div>
                                <div class="tile-value">${getWindDirection(windDeg)}풍</div>
                            </div>
                        </div>
                        <div class="col-6 col-md-4">
                            <div class="tile p-3 text-center">
                                <span class="tile-icon icon-wind-speed mb-2"><i class="bi bi-wind"></i></span>
                                <div class="tile-label">풍속</div>
                                <div class="tile-value">${data.wind.speed} m/s</div>
                            </div>
                        </div>
                        <div class="col-6 col-md-6">
                            <div class="tile p-3 text-center">
                                <span class="tile-icon icon-temp-max mb-2"><i class="bi bi-thermometer-sun"></i></span>
                                <div class="tile-label">최고 온도</div>
                                <div class="tile-value">${Math.round(data.main.temp_max)}°C</div>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="tile p-3 text-center">
                                <span class="tile-icon icon-temp-min mb-2"><i class="bi bi-thermometer-snow"></i></span>
                                <div class="tile-label">최저 온도</div>
                                <div class="tile-value">${Math.round(data.main.temp_min)}°C</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderError(message) {
            result.innerHTML = `
                <div class="alert alert-danger text-center" style="border-radius:1.5rem;">${message}</div>
            `;
        }

        searchBtn.addEventListener("click", () => {
            if (!API_KEY) {
                renderError("API 키가 입력되지 않았습니다. 코드의 API_KEY 값을 입력해 주세요.");
                return;
            }

            const city = citySelect.value;
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=kr`;

            fetch(url)
                .then((res) => {
                    if (!res.ok) throw new Error(`요청 실패 (${res.status})`);
                    return res.json();
                })
                .then((data) => renderWeather(data))
                .catch((err) => renderError(`날씨 정보를 가져오지 못했습니다: ${err.message}`));
        });
    </script>
</body>
</html>
